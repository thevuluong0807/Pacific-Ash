<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="2000" height="400">
  <!-- Tàu sân bay, 5 ô, nhìn từ trên xuống, mũi hướng +x. Boong bay rộng gần hết chiều cao ô, đảo chỉ huy ở mạn phải (cạnh dưới). -->
  <title>carrier 2D</title>
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7F8C98"/><stop offset="0.28" stop-color="#E9EFF4"/><stop offset="0.55" stop-color="#B4BFC9"/><stop offset="1" stop-color="#6B7885"/></linearGradient>
    <linearGradient id="fd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8794A0"/><stop offset="0.5" stop-color="#A5B0BA"/><stop offset="1" stop-color="#76828E"/></linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F6F9"/><stop offset="1" stop-color="#B9C4CE"/></linearGradient>
    <g id="ciws"><circle r="3.4" fill="#F1F4F7" stroke="#0B1117" stroke-width="1.5"/><circle cx="-1" cy="-1" r="1" fill="#fff"/></g>
    <g id="plane"><path d="M-9 0 L6 -1.6 L10 0 L6 1.6 Z" fill="#DCE3E9" stroke="#0B1117" stroke-width="1.3" stroke-linejoin="round"/><path d="M-1 0 L-6 -9 L1 -9 L4 0 L1 9 L-6 9 Z" fill="#C2CCD5" stroke="#0B1117" stroke-width="1.3" stroke-linejoin="round"/><path d="M-8 0 L-11 -4 L-8.5 -4 L-6 0 L-8.5 4 L-11 4 Z" fill="#AEB9C3" stroke="#0B1117" stroke-width="1.1" stroke-linejoin="round"/></g>
  </defs>
  <path d="M16 30 L124 20 L434 18 Q486 26 498 56 Q486 86 434 94 L152 94 L100 99 L30 90 L16 76 Z" fill="#000" opacity=".32"/>
  <!-- thân + mép sườn tàu phía dưới boong -->
  <path d="M12 26 L120 15 L430 13 Q480 21 494 50 Q480 79 430 87 L148 89 L96 95 L26 85 L12 71 Z" fill="url(#hull)" stroke="#0B1117" stroke-width="3" stroke-linejoin="round"/>
  <!-- boong bay -->
  <path d="M18 28 L120 19 L428 17 Q472 24 486 50 Q472 76 428 83 L150 85 L96 90 L30 82 L18 70 Z" fill="url(#fd)" stroke="#3E4955" stroke-width="2" stroke-linejoin="round"/>
  <!-- vạch boong: tim, đường hạ cánh chéo, ống phóng -->
  <path d="M40 50 H470" stroke="#F4F7FA" stroke-width="1.6" stroke-dasharray="14 8"/>
  <path d="M28 66 L250 36" stroke="#F4F7FA" stroke-width="2.4"/><path d="M28 70 L250 40" stroke="#E7C34A" stroke-width="1.2" stroke-dasharray="6 5"/>
  <path d="M380 38 H478 M380 62 H478" stroke="#2B343C" stroke-width="2.4"/><path d="M380 36 v4 M380 60 v4" stroke="#E08A2E" stroke-width="3"/>
  <path d="M60 58 v14 M72 60 v14 M84 62 v14" stroke="#EEF3F6" stroke-width="1.2"/>
  <!-- thang máy máy bay -->
  <rect x="210" y="68" width="36" height="14" rx="2" fill="#5C6975" stroke="#0B1117" stroke-width="2"/>
  <path d="M214 82 L226 68 M226 82 L238 68 M238 82 L246 72" stroke="#2B343C" stroke-width="1.2"/>
  <rect x="352" y="20" width="36" height="14" rx="2" fill="#5C6975" stroke="#0B1117" stroke-width="2"/>
  <path d="M356 34 L368 20 M368 34 L380 20 M380 34 L388 24" stroke="#2B343C" stroke-width="1.2"/>
  <!-- máy bay đậu -->
  <use href="#plane" x="140" y="34"/><use href="#plane" x="168" y="30"/><use href="#plane" x="300" y="30"/><use href="#plane" x="240" y="58"/>
  <rect x="268" y="56" width="10" height="5" rx="2" fill="#E08A2E" stroke="#0B1117" stroke-width="1.2"/>
  <!-- đảo chỉ huy (mạn phải = cạnh dưới) -->
  <rect x="290" y="70" width="56" height="22" rx="3" fill="#000" opacity=".25"/>
  <rect x="288" y="66" width="56" height="22" rx="3" fill="url(#block)" stroke="#0B1117" stroke-width="2.4"/>
  <rect x="294" y="70" width="22" height="10" rx="2" fill="#39434D" stroke="#0B1117" stroke-width="1.4"/>
  <rect x="336" y="68" width="5" height="18" rx="1.5" fill="#142431" stroke="#0B1117" stroke-width="1.2"/>
  <circle cx="324" cy="77" r="6" fill="#C2CCD5" stroke="#0B1117" stroke-width="1.6"/><circle cx="324" cy="77" r="2" fill="#0B1117"/>
  <path d="M290 72 H284 M290 84 H284" stroke="#4E5A66" stroke-width="2" stroke-linecap="round"/>
  <use href="#ciws" x="70" y="22"/><use href="#ciws" x="460" y="26"/><use href="#ciws" x="76" y="84"/><use href="#ciws" x="440" y="80"/>
</svg>
