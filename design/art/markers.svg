<text x="20" y="210" fill="#4FC3E8" font-size="12">Hit: lỗ cháy xé thép, mép kim loại cong ra, lõi than hồng nhấp nháy nhẹ (độ mờ lõi 0.85–1, 1.2 s). Sunk: ô của tàu đã chìm hiện lại sprite tàu (xám tối) kèm dấu X đỏ viền trắng trên mỗi ô; tĩnh. Miss: vành nước bắn ra rồi lặng trong markerPopMs.</text>
<text x="20" y="232" fill="#4FC3E8" font-size="12">Mọi marker phủ lên sprite tàu, không thay sprite. Hit và miss phải đọc được ở ô 32 px: chi tiết nhỏ (vết nứt, giọt) được phép mờ đi, hình khối chính thì không.</text></svg>