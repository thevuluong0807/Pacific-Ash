  <rect width="760" height="640" fill="#0B1117"/>
  <g color="#C9D4DC">
    <text x="20" y="26" fill="#4FC3E8" font-size="13">Icon tàu 64×32 (màu mặc định text, trạng thái: ready #5BD98A, cooldown #C9A227, sunk #8B1A14)</text>
    <use href="#ship-destroyer" x="20" y="40" width="128" height="64"/><use href="#ship-cruiser" x="170" y="40" width="128" height="64"/><use href="#ship-submarine" x="320" y="40" width="128" height="64"/><use href="#ship-missile" x="470" y="40" width="128" height="64"/><use href="#ship-carrier" x="620" y="40" width="128" height="64"/>
    <g fill="#7F8E9B"><text x="20" y="118">destroyer</text><text x="170" y="118">cruiser</text><text x="320" y="118">submarine</text><text x="470" y="118">missile</text><text x="620" y="118">carrier</text></g>
    <text x="20" y="160" fill="#4FC3E8" font-size="13">Icon UI 24×24 (hiển thị 48)</text>
    <g>
      <use href="#i-hit" x="20" y="176" width="48" height="48" color="#FF3B2F"/><use href="#i-miss" x="90" y="176" width="48" height="48" color="#5B7184"/><use href="#i-sunk" x="160" y="176" width="48" height="48" color="#8B1A14"/><use href="#i-rotate" x="230" y="176" width="48" height="48"/><use href="#i-skip" x="300" y="176" width="48" height="48"/><use href="#i-gear" x="370" y="176" width="48" height="48"/><use href="#i-lock" x="440" y="176" width="48" height="48"/><use href="#i-sound" x="510" y="176" width="48" height="48"/>
      <use href="#i-check" x="20" y="250" width="48" height="48" color="#5BD98A"/><use href="#i-cooldown" x="90" y="250" width="48" height="48" color="#C9A227"/><use href="#i-aim" x="160" y="250" width="48" height="48" color="#E8742A"/><use href="#i-fleet" x="230" y="250" width="48" height="48"/><use href="#i-log" x="300" y="250" width="48" height="48"/><use href="#i-back" x="370" y="250" width="48" height="48"/><use href="#i-info" x="440" y="250" width="48" height="48"/>
    </g>
    <g fill="#7F8E9B"><text x="20" y="236">hit</text><text x="90" y="236">miss</text><text x="160" y="236">sunk</text><text x="230" y="236">rotate</text><text x="300" y="236">skip</text><text x="370" y="236">gear</text><text x="440" y="236">lock</text><text x="510" y="236">sound</text><text x="20" y="310">check</text><text x="90" y="310">cooldown</text><text x="160" y="310">aim</text><text x="230" y="310">fleet</text><text x="300" y="310">log</text><text x="370" y="310">back</text><text x="440" y="310">info</text></g>
    <text x="20" y="352" fill="#4FC3E8" font-size="13">Icon đòn đánh 50×50 (tô màu hostile #E8742A)</text>
    <g color="#E8742A">
      <use href="#atk-rapid" x="20" y="366" width="100" height="100"/><use href="#atk-precision" x="150" y="366" width="100" height="100"/><use href="#atk-torpedo" x="280" y="366" width="100" height="100"/><use href="#atk-cross" x="410" y="366" width="100" height="100"/><use href="#atk-line3" x="540" y="366" width="100" height="100"/>
    </g>
    <g fill="#7F8E9B"><text x="20" y="482">rapid</text><text x="150" y="482">precision</text><text x="280" y="482">torpedo</text><text x="410" y="482">cross</text><text x="540" y="482">line3</text></g>
    <text x="20" y="522" fill="#4FC3E8" font-size="13">Tàu mới (nội tại) và icon kỹ năng</text>
    <use href="#ship-raider" x="20" y="534" width="128" height="64"/><use href="#ship-escort" x="170" y="534" width="128" height="64"/>
    <g color="#E8742A"><use href="#atk-sneak" x="340" y="534" width="80" height="80"/><use href="#atk-guard" x="450" y="534" width="80" height="80"/></g>
    <g fill="#7F8E9B"><text x="20" y="612">raider</text><text x="170" y="612">escort</text><text x="340" y="628">sneak</text><text x="450" y="628">guard</text></g>
