    <symbol id="atk-rapid" viewBox="0 0 50 50"><g fill="none" stroke="currentColor" stroke-opacity=".35"><path d="M0 10H50M0 20H50M0 30H50M0 40H50M10 0V50M20 0V50M30 0V50M40 0V50"/></g><rect x="10" y="30" width="10" height="10" fill="currentColor"/><rect x="30" y="10" width="10" height="10" fill="currentColor"/><path d="M26 28 L36 28 M32 24 L36 28 L32 32" fill="none" stroke="currentColor" stroke-opacity=".0"/></symbol>
    <symbol id="atk-precision" viewBox="0 0 50 50"><g fill="none" stroke="currentColor" stroke-opacity=".35"><path d="M0 10H50M0 20H50M0 30H50M0 40H50M10 0V50M20 0V50M30 0V50M40 0V50"/></g><rect x="20" y="20" width="10" height="10" fill="currentColor"/><circle cx="25" cy="25" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
