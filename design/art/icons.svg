    <symbol id="atk-line3" viewBox="0 0 50 50"><g fill="none" stroke="currentColor" stroke-opacity=".35"><path d="M0 10H50M0 20H50M0 30H50M0 40H50M10 0V50M20 0V50M30 0V50M40 0V50"/></g><rect x="10" y="20" width="10" height="10" fill="currentColor"/><rect x="20" y="20" width="10" height="10" fill="currentColor"/><rect x="30" y="20" width="10" height="10" fill="currentColor"/></symbol>
