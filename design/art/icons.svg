    <symbol id="map-truong-sa" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><path d="M2 36 Q9 30 16 31 Q23 28 30 36"/><path d="M12 31 Q11 22 15 15 M15 15 L8 17 M15 15 L21 12 M15 15 L19 21 M15 15 L9 11"/><path d="M33 22 H44 M35 22 V36 M42 22 V36 M35 28 H42 M36 22 L41 34"/><circle cx="38" cy="10" r="3"/><path d="M2 41 H46 M8 45 H20 M28 45 H40"/></symbol>
