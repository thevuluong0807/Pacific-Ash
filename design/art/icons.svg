    <symbol id="i-cooldown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 3 H18 M6 21 H18 M7 3 Q7 11 12 12 Q17 11 17 3 M7 21 Q7 13 12 12 Q17 13 17 21"/></symbol>
