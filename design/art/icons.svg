    <symbol id="atk-sneak" viewBox="0 0 50 50"><g fill="none" stroke="currentColor" stroke-opacity=".35"><path d="M0 10H50M0 20H50M0 30H50M0 40H50M10 0V50M20 0V50M30 0V50M40 0V50"/></g><rect x="30" y="10" width="10" height="10" fill="currentColor"/><text x="35" y="18.4" font-size="9" text-anchor="middle" font-family="monospace" fill="#0B1117" font-weight="700">?</text><path d="M4 44 L16 44 M10 38 L16 44 L10 50" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/><circle cx="26" cy="38" r="2.2" fill="currentColor"/><circle cx="34" cy="30" r="2.2" fill="currentColor" fill-opacity=".5"/></symbol>
    <symbol id="atk-guard" viewBox="0 0 50 50"><g fill="none" stroke="currentColor" stroke-opacity=".35"><path d="M0 10H50M0 20H50M0 30H50M0 40H50M10 0V50M20 0V50M30 0V50M40 0V50"/></g><rect x="20" y="10" width="10" height="10" fill="currentColor" fill-opacity=".25"/><rect x="10" y="20" width="10" height="10" fill="currentColor"/><rect x="20" y="20" width="10" height="10" fill="currentColor" fill-opacity=".25"/><rect x="30" y="20" width="10" height="10" fill="currentColor"/><rect x="20" y="30" width="10" height="10" fill="currentColor"/><path d="M20 10 L30 20 M30 10 L20 20 M20 20 L30 30 M30 20 L20 30" stroke="#0B1117" stroke-width="2"/><path d="M25 3 L35 7 V14 Q35 18 25 22 Q15 18 15 14 V7Z" fill="none" stroke="currentColor" stroke-width="2" transform="translate(0,-2) scale(1)" /></symbol>
