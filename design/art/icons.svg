    <symbol id="i-skip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 5 L15 12 L5 19 Z"/><path d="M19 5 V19"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><circle cx="12" cy="12" r="3.5"/><path d="M10 2 H14 L15 5 L18 6.5 L21 5 L23 8 L21 10.5 V13.5 L23 16 L21 19 L18 17.5 L15 19 L14 22 H10 L9 19 L6 17.5 L3 19 L1 16 L3 13.5 V10.5 L1 8 L3 5 L6 6.5 L9 5 Z" transform="scale(.92) translate(1 1)"/></symbol>
