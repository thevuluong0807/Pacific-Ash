<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="1520" height="1280" font-family="monospace" font-size="11">
  <!-- Bộ icon: dùng <symbol>, tô bằng currentColor. Icon tàu 64x32, icon UI 24x24, icon đòn đánh 50x50. Nét 2, đầu nét vuông, không gradient. -->
  <title>icon set</title>
  <defs>
    <!-- === ICON TÀU (side view đơn sắc, 64x32) === -->
    <symbol id="ship-destroyer" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><path d="M4 20 H60 L52 26 H10 Z"/><path d="M22 20 V14 H34 V20 M28 14 V8"/><path d="M42 20 V17 H46 V20 M46 18 H52"/><path d="M12 20 V17 H16 V20"/></symbol>
    <symbol id="ship-cruiser" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><path d="M2 20 H62 L54 26 H8 Z"/><path d="M26 20 V12 H36 V20 M31 12 V5"/><path d="M42 20 V16 H47 V20 M47 17 H55 M47 19 H55"/><path d="M50 20 H48"/><path d="M12 20 V16 H17 V20 M17 17 H21"/></symbol>
    <symbol id="ship-submarine" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="square"><path d="M4 20 Q4 14 12 14 H52 Q60 14 60 20 Q60 26 52 26 H12 Q4 26 4 20 Z"/><path d="M24 14 V9 H36 V14 M32 9 V4 H36"/><path d="M4 20 L0 14 M4 20 L0 26"/></symbol>
    <symbol id="ship-missile" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><path d="M2 20 H62 L54 26 H8 Z"/><path d="M8 20 V15 H20 V20 M12 15 V20 M16 15 V20 M8 17.5 H20"/><path d="M26 20 V11 H36 V20 M31 11 V5"/><path d="M42 20 V15 H54 V20 M46 15 V20 M50 15 V20 M42 17.5 H54"/></symbol>
    <symbol id="ship-carrier" viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter" stroke-linecap="square"><path d="M0 18 H64 L58 26 H6 Z"/><path d="M36 18 V10 H44 V18 M40 10 V4"/><path d="M10 15 L14 15 M18 15 L22 15"/></symbol>
    <!-- === ICON UI (24x24) === -->
    <symbol id="i-hit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><polygon points="22.3,14.1 15.7,15.3 15.3,22 11,16.9 5,19.9 7.3,13.6 1.7,9.9 8.3,8.7 8.7,2 13,7.1 19,4.1 16.7,10.4"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path d="M3 4 L6 6.5 M20.5 3.5 L18 6.5 M21 20 L18 17.5 M3.5 20.5 L6.5 17.5" stroke-linecap="square"/></symbol>
    <symbol id="i-miss" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="3.2" ry="2.8"/><polygon points="19.4,12 19.8,16.5 15.7,18.4 12,21 8.3,18.4 4.2,16.5 4.6,12 4.2,7.5 8.3,5.6 12,3 15.7,5.6 19.8,7.5" stroke-linejoin="round"/><circle cx="3.6" cy="5" r=".9" fill="currentColor" stroke="none"/><circle cx="20.4" cy="5.6" r=".9" fill="currentColor" stroke="none"/><circle cx="21" cy="19" r=".9" fill="currentColor" stroke="none"/><circle cx="3" cy="19.4" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sunk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M3 4 Q8 9 12 11 Q17 13 21 20 M21 4 Q16 9 12 12 Q7 15 3 20"/><path d="M3 21 H8 M16 21 H21 M2 14 L6 13 M18 8 L22 9" stroke-width="1.8"/></symbol>
