<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="400" height="400">
  <!-- Tàu cắn lén, 1x1, nhìn từ trên xuống, mũi hướng +x. Thấp, góc cạnh tàng hình, tối hơn tàu nổi khác. -->
  <title>raider 2D</title>
  <defs>
    <linearGradient id="rh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B353F"/><stop offset=".3" stop-color="#A7B4C0"/><stop offset=".55" stop-color="#586673"/><stop offset="1" stop-color="#222B34"/></linearGradient>
    <linearGradient id="rd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C8995"/><stop offset=".5" stop-color="#A8B4BF"/><stop offset="1" stop-color="#5E6B77"/></linearGradient>
    <linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D3DC"/><stop offset="1" stop-color="#7B8895"/></linearGradient>
  </defs>
  <!-- bóng và vệt nước -->
  <path d="M14 42 L22 38 L66 36 L97 55 L66 73 L22 70 L14 66Z" fill="#000" opacity=".32"/>
  <path d="M6 44 Q-4 50 6 56 M10 40 Q-2 50 10 60" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
  <!-- thân góc cạnh -->
  <polygon points="10,40 18,33 62,31 94,50 62,69 18,67 10,60" fill="url(#rh)" stroke="#0B1117" stroke-width="2.6" stroke-linejoin="miter"/>
  <path d="M22 34.5 L62 33 L88 48" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
  <!-- mặt boong có các mảng vát -->
  <polygon points="16,42 22,37 60,35 84,50 60,65 22,63 16,58" fill="url(#rd)" stroke="#3B4650" stroke-width="1.2" stroke-linejoin="miter"/>
  <path d="M22 50 H84" stroke="#3B4650" stroke-width="1"/>
  <path d="M30 37 L38 50 L30 63 M52 35.4 L58 50 L52 64.6" fill="none" stroke="#3B4650" stroke-width=".9"/>
  <!-- khối thượng tầng tàng hình (vát, đổ bóng) -->
  <polygon points="33,45 39,41 51,41 56,47 56,53 51,59 39,59 33,55" fill="#000" opacity=".28" transform="translate(1.6,2)"/>
  <polygon points="33,45 39,41 51,41 56,47 56,53 51,59 39,59 33,55" fill="url(#rb)" stroke="#0B1117" stroke-width="2" stroke-linejoin="miter"/>
  <polygon points="46,44 53,48 53,52 46,56" fill="#142431" stroke="#0B1117" stroke-width="1"/>
  <circle cx="40" cy="50" r="3" fill="#C2CCD5" stroke="#0B1117" stroke-width="1.2"/><circle cx="40" cy="50" r="1" fill="#0B1117"/>
  <!-- pháo nhỏ ở mũi -->
  <circle cx="68" cy="50" r="5" fill="#7E8B97" stroke="#0B1117" stroke-width="1.8"/><circle cx="68" cy="50" r="3" fill="#CBD4DC" stroke="#0B1117" stroke-width="1"/>
  <rect x="71" y="48.8" width="14" height="2.4" rx="1" fill="#46525E" stroke="#0B1117" stroke-width="1.1"/>
  <!-- điểm nhấn cam -->
  <rect x="17" y="47.6" width="9" height="4.8" rx="1.5" fill="#E08A2E" stroke="#0B1117" stroke-width="1.1"/>
</svg>
